[package]
name = "migrador-odoo"
version = "0.1.0"
description = "Odoo Migrator Desktop Application"
authors = ["Consulting Team"]
edition = "2021"


[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.0.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
